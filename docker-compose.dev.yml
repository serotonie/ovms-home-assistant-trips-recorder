services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:2-3.13-trixie
    command: sleep infinity
    working_dir: /workspaces/ovms-home-assistant-trips-recorder
    volumes:
      - .:/workspaces/ovms-home-assistant-trips-recorder:cached
      - ../ovms-home-assistant:/workspaces/ovms-home-assistant:cached

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: trips-recorder-ha-dev
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8123:8123"
    volumes:
      - ./dev/ha-config:/config
      - ./custom_components/trips_recorder:/config/custom_components/trips_recorder:ro
      - ../ovms-home-assistant/custom_components/ovms:/config/custom_components/ovms:ro
    environment:
      TZ: Europe/Paris

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: trips-recorder-mqtt-dev
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./dev/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:
